<!DOCTYPE html>
<html>

<head>
    <title data-locale-res="STORE_GADGETPAGETITLE">Gadget Detail - Sidebar Gadget Web Store</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleai.css">
    <script src="storeapi.js"></script>
    <script src="locale.js"></script>
    <style>
        /* ===== 全局重置 ===== */
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        /* ===== 深色标题栏 (Metro) ===== */
        
        .store-header {
            background: #000000;
            border-bottom: 4px solid #0078d7;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .store-header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            padding: 0 8px;
        }
        
        .store-header-title {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0;
            text-transform: uppercase;
        }
        
        .store-header-nav a {
            color: rgba(255, 255, 255, 0.70);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            padding: 6px 14px;
            transition: background 0.15s, color 0.15s;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        
        .store-header-nav a:hover {
            background: rgba(255, 255, 255, 0.10);
            color: #ffffff;
        }
        
        .store-header-nav a.active {
            color: #ffffff;
            background: rgba(0, 120, 215, 0.40);
        }
        /* ===== 主容器 ===== */
        
        .store-list {
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px 40px 60px;
        }
        /* ===== 详情卡片 (Metro 平铺) ===== */
        
        .detail-card {
            background: #ffffff;
            border: 2px solid #d1d5db;
            padding: 24px 28px 28px;
            border-radius: 0;
            box-shadow: none;
        }
        /* ===== 头部返回行 ===== */
        
        .detail-header-row {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        
        .metro-backbutton {
            background: transparent;
            border: none;
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
            color: #1a1a2e;
            padding: 0 8px 0 0;
            transition: color 0.15s;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 300;
            flex-shrink: 0;
        }
        
        .metro-backbutton:hover {
            color: #0078d7;
        }
        
        .metro-backbutton::before {
            content: '\2039';
            font-size: 36px;
            font-weight: 300;
        }
        
        .detail-title {
            font-size: 24px;
            font-weight: 300;
            color: #1a1a2e;
            margin: 0;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }
        /* ===== Logo & 发布者 ===== */
        
        .detail-logo-row {
            display: flex;
            align-items: center;
            gap: 18px;
            margin: 12px 0 10px;
            flex-wrap: wrap;
        }
        
        .detail-logo {
            width: 64px;
            height: 64px;
            background: #f0f2f5;
            object-fit: contain;
            border: 1px solid #d1d5db;
            flex-shrink: 0;
            border-radius: 0;
        }
        
        .detail-publisher {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
            word-break: break-word;
        }
        /* ===== 描述 ===== */
        
        .detail-section-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 20px 0 4px 0;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #d1d5db;
            padding-bottom: 4px;
            text-transform: uppercase;
        }
        
        .detail-description {
            font-size: 14px;
            line-height: 1.6;
            color: #2d2d44;
            margin: 0 0 12px 0;
            background: #f8f9fc;
            border: 1px solid #e6e9ef;
            padding: 12px 16px;
            word-break: break-word;
            overflow-wrap: break-word;
            border-radius: 0;
        }
        /* ===== 下载区域 ===== */
        
        .detail-download-area {
            border: 2px solid #e6e9ef;
            background: #f8f9fc;
            padding: 16px 20px;
            margin: 4px 0 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 24px;
            width: 100%;
            border-radius: 0;
        }
        
        .detail-download-btn {
            background: #0078d7;
            border: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 28px;
            border-radius: 0;
            cursor: pointer;
            transition: background 0.15s;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        
        .detail-download-btn:hover {
            background: #005a9e;
        }
        
        .detail-download-btn:active {
            opacity: 0.8;
        }
        
        .detail-download-btn:disabled {
            background: #b0b8c4;
            cursor: not-allowed;
        }
        
        .detail-hash {
            font-size: 13px;
            color: #4b5563;
            word-break: break-all;
            overflow-wrap: break-word;
            margin: 0;
            flex: 1;
            min-width: 120px;
        }
        
        .detail-hash strong {
            font-weight: 500;
            color: #1a1a2e;
        }
        /* ===== 版本表格 (Metro 硬边风格) ===== */
        
        .metro-table-wrap {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            margin-top: 6px;
            border: 2px solid #d1d5db;
            background: #ffffff;
            -webkit-overflow-scrolling: touch;
        }
        
        .metro-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: #ffffff;
            min-width: 700px;
            table-layout: fixed;
        }
        
        .metro-table thead th {
            background: #f0f2f5;
            color: #1a1a2e;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 2px solid #d1d5db;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 列宽分配 */
        
        .metro-table .col-version {
            width: 10%;
        }
        
        .metro-table .col-date {
            width: 15%;
        }
        
        .metro-table .col-size {
            width: 10%;
        }
        
        .metro-table .col-os {
            width: 15%;
        }
        
        .metro-table .col-arch {
            width: 15%;
        }
        
        .metro-table .col-hash {
            width: 25%;
        }
        
        .metro-table .col-dl {
            width: 10%;
        }
        
        .metro-table tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid #edf0f5;
            color: #2d2d44;
            vertical-align: middle;
            line-height: 1.4;
            word-break: break-word;
            overflow-wrap: break-word;
            overflow: hidden;
        }
        
        .metro-table tbody tr:hover {
            background: #f8f9fc;
        }
        
        .metro-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .metro-table .hash-cell {
            word-break: break-all;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
        }
        
        .metro-table .download-link {
            color: #0078d7;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            padding: 4px 6px;
            transition: background 0.15s;
            display: inline-block;
            white-space: nowrap;
            text-transform: uppercase;
            font-size: 12px;
            border: 1px solid transparent;
        }
        
        .metro-table .download-link:hover {
            background: #e8f0fe;
            border-color: #0078d7;
            text-decoration: none;
        }
        
        .metro-table .chip-arch {
            background: #eef2f6;
            padding: 2px 10px;
            font-size: 12px;
            color: #1a1a2e;
            display: inline-block;
            margin: 1px 2px 1px 0;
            white-space: nowrap;
            border: 1px solid #d1d5db;
        }
        /* ===== 响应式 ===== */
        
        @media (max-width: 768px) {
            .store-header {
                padding: 0 16px;
            }
            .store-header-container {
                height: 52px;
            }
            .store-header-title {
                font-size: 16px;
            }
            .store-list {
                padding: 16px 16px 40px;
            }
            .detail-card {
                padding: 16px 14px 20px;
            }
            .detail-title {
                font-size: 20px;
            }
            .detail-download-area {
                flex-direction: column;
                align-items: stretch;
            }
            .detail-download-btn {
                text-align: center;
            }
            .metro-table {
                font-size: 12px;
                min-width: 600px;
            }
            .metro-table thead th,
            .metro-table tbody td {
                padding: 8px 10px;
            }
        }
        
        @media (max-width: 480px) {
            .detail-logo {
                width: 48px;
                height: 48px;
            }
            .detail-title {
                font-size: 18px;
            }
            .metro-table {
                min-width: 480px;
                font-size: 11px;
            }
            .metro-table .hash-cell {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <header class="store-header">
        <div class="store-header-container">
            <h1 class="store-header-title" data-locale-res="STORE_NAME">Sidebar Gadget Web Store</h1>
            <nav class="store-header-nav">
                <a href="index_ai.html" data-locale-res="STORE_HOMEPAGE">主页</a>
            </nav>
        </div>
    </header>

    <div class="store-list" style="height: calc(100% - 60px); overflow: auto;">
        <div class="detail-card">

            <!-- 返回 + 标题 -->
            <div class="detail-header-row">
                <button id="backpage" class="metro-backbutton" aria-label="Back"></button>
                <h2 class="detail-title" id="detailTitle">Title</h2>
            </div>

            <!-- Logo + 发布者 -->
            <div class="detail-logo-row">
                <img class="detail-logo" id="detailLogo" src="" alt="Logo">
                <span class="detail-publisher" id="detailPublisher">Publisher</span>
            </div>

            <!-- 描述 -->
            <h3 class="detail-section-title" data-locale-res="STORE_DESC">Description</h3>
            <p class="detail-description" id="detailDescription">Description</p>

            <!-- 下载 -->
            <h3 class="detail-section-title" data-locale-res="STORE_DOWNLOAD">Download</h3>
            <div class="detail-download-area">
                <button id="download" class="detail-download-btn" data-locale-res="STORE_DOWNLOADNEWEST">Download Newest Version</button>
                <p class="detail-hash">
                    <strong data-locale-res="STORE_HASH">Hash (SHA-256): </strong>
                    <span id="hash" style="word-break: break-all; user-select: text;">--</span>
                </p>
            </div>

            <!-- 版本表格 -->
            <h3 class="detail-section-title" data-locale-res="STORE_VERSIONLIST">All versions</h3>
            <div class="metro-table-wrap">
                <table class="metro-table" id="store-versions-table" style="user-select: text;">
                    <thead>
                        <tr>
                            <th class="col-version" data-locale-res="STORE_VERITEM_VERSION">Version</th>
                            <th class="col-date" data-locale-res="STORE_VERITEM_RELDATE">Release Date</th>
                            <th class="col-size" data-locale-res="STORE_VERITEM_SIZE">Size</th>
                            <th class="col-os" data-locale-res="STORE_VERITEM_OS">OS Min</th>
                            <th class="col-arch" data-locale-res="STORE_VERITEM_CPU">Architecture</th>
                            <th class="col-hash" data-locale-res="STORE_VERITEM_HASH">Hash (SHA-256)</th>
                            <th class="col-dl" data-locale-res="STORE_VERITEM_DOWNLOAD">Download</th>
                        </tr>
                    </thead>
                    <tbody id="versionsBody">
                        <!-- 动态渲染 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        (function(global) {
            var backbutton = document.getElementById("backpage");
            backbutton.addEventListener("click", function() {
                global.history.back();
                return false;
            });

            // 手动解析 URL 查询参数（兼容 IE11）
            function getQueryParam(name) {
                var search = window.location.search;
                if (search.length === 0) return null;
                // 去掉开头的 '?'
                var qs = search.substring(1);
                var pairs = qs.split('&');
                for (var i = 0; i < pairs.length; i++) {
                    var pair = pairs[i].split('=');
                    var key = decodeURIComponent(pair[0]);
                    if (key === name) {
                        return decodeURIComponent(pair[1] || '');
                    }
                }
                return null;
            }

            function renderDetail() {
                var id = getQueryParam("familyname");
                if (!id) {
                    document.querySelector(".detail-title").innerText = "Invalid Item";
                    return;
                }

                store.getItem(id, function(item) {
                    // 基本信息
                    var displayName = store.getItemDisplayName(item);
                    document.querySelector(".detail-title").innerText = displayName;
                    document.querySelector(".detail-publisher").innerText = store.getItemPublisher(item);
                    document.querySelector(".detail-description").innerText = store.getItemDescription(item);
                    document.getElementById("detailLogo").src = store.getItemLogo(item);

                    // 下载按钮与哈希
                    var downloadButton = document.getElementById("download");
                    var hashSpan = document.getElementById("hash");
                    var newestItem = store.getNewestVersionItem(item);
                    var supportedItem = store.getSupportedNewestVersionItem(item);

                    if (supportedItem && newestItem && supportedItem.version === newestItem.version) {
                        downloadButton.innerText = locale.getStringResource("STORE_DOWNLOADNEWEST") || "Download Newest";
                        hashSpan.innerText = newestItem.normalHash || "--";
                        downloadButton.onclick = function() {
                            location.href = item.directory + "/" + newestItem.directory + "/" + newestItem.pkgFile;
                        };
                    } else if (supportedItem) {
                        downloadButton.innerText = locale.getStringResource("STORE_DOWNLOADSN") ||
                            "Download compatible version";
                        hashSpan.innerText = supportedItem.normalHash || "--";
                        downloadButton.onclick = function() {
                            location.href = item.directory + "/" + supportedItem.directory + "/" + supportedItem
                                .pkgFile;
                        };
                    } else {
                        // 没有兼容版本，回退到最新
                        downloadButton.innerText = locale.getStringResource("STORE_DOWNLOADNEWEST") || "Download Newest";
                        if (newestItem) {
                            hashSpan.innerText = newestItem.normalHash || "--";
                            downloadButton.onclick = function() {
                                location.href = item.directory + "/" + newestItem.directory + "/" + newestItem
                                    .pkgFile;
                            };
                        } else {
                            hashSpan.innerText = "--";
                            downloadButton.disabled = true;
                            downloadButton.innerText = "No version available";
                        }
                    }

                    // 渲染版本表格
                    var tbody = document.getElementById("versionsBody");
                    tbody.innerHTML = "";
                    if (item.items && item.items.length > 0) {
                        // 按版本号降序排列（最新在前）
                        var sorted = item.items.slice().sort(function(a, b) {
                            var va = a.version.split('.').map(Number);
                            var vb = b.version.split('.').map(Number);
                            var maxLen = va.length > vb.length ? va.length : vb.length;
                            for (var i = 0; i < maxLen; i++) {
                                var na = i < va.length ? va[i] : 0;
                                var nb = i < vb.length ? vb[i] : 0;
                                if (na !== nb) return nb - na;
                            }
                            return 0;
                        });

                        sorted.forEach(function(si) {
                            var row = document.createElement("tr");
                            var tdVersion = document.createElement("td");
                            var tdDate = document.createElement("td");
                            var tdSize = document.createElement("td");
                            var tdOs = document.createElement("td");
                            var tdArch = document.createElement("td");
                            var tdHash = document.createElement("td");
                            var tdDl = document.createElement("td");

                            tdVersion.innerText = si.version || "--";
                            tdDate.innerText = locale.formatLocalDate ? locale.formatLocalDate(si.releaseDate) :
                                si.releaseDate || "--";
                            tdSize.innerText = si.size || "--";

                            // 获取 OS 最小版本（兼容可选链）
                            var osMin = si.supportOs && si.supportOs.osMinVersion ? si.supportOs.osMinVersion : "0.0";
                            tdOs.innerText = locale.getFriendlySystemName ? locale.getFriendlySystemName("Windows",
                                osMin) : osMin;

                            // 架构处理（兼容可选链）
                            var archs = si.supportOs && si.supportOs.processorArchitecture ? si.supportOs
                                .processorArchitecture : ["Unknown"];
                            var archHtml = "";
                            for (var idx = 0; idx < archs.length; idx++) {
                                archHtml += '<span class="chip-arch">' + archs[idx] + '</span>';
                            }
                            tdArch.innerHTML = archHtml;

                            tdHash.className = "hash-cell";
                            tdHash.innerText = si.normalHash || "--";

                            var dlLink = document.createElement("span");
                            dlLink.className = "download-link";
                            dlLink.innerText = locale.getStringResource("STORE_VERITEM_DOWNLOAD") || "Download";
                            // 闭包捕获 si
                            (function(s) {
                                dlLink.addEventListener("click", function(e) {
                                    e.stopPropagation();
                                    location.href = item.directory + "/" + s.directory + "/" + s.pkgFile;
                                });
                            })(si);

                            tdDl.appendChild(dlLink);

                            row.appendChild(tdVersion);
                            row.appendChild(tdDate);
                            row.appendChild(tdSize);
                            row.appendChild(tdOs);
                            row.appendChild(tdArch);
                            row.appendChild(tdHash);
                            row.appendChild(tdDl);
                            tbody.appendChild(row);
                        });
                    } else {
                        var emptyRow = document.createElement("tr");
                        var emptyCell = document.createElement("td");
                        emptyCell.colSpan = 7;
                        emptyCell.innerText = "No versions available";
                        emptyCell.style.textAlign = "center";
                        emptyCell.style.padding = "30px 0";
                        emptyRow.appendChild(emptyCell);
                        tbody.appendChild(emptyRow);
                    }

                    // 更新页面标题
                    var titleTemplate = locale.getStringResource("STORE_GADGETPAGETITLE") || "{0} - Detail";
                    document.title = titleTemplate.replace("{0}", displayName);

                }, function(error) {
                    document.querySelector(".detail-title").innerText = "Load Error";
                    document.querySelector(".detail-description").innerText = "Failed to load gadget details.";
                });
            }

            global.window.onload = function() {
                renderDetail();
                locale.processAllResources();
            };
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                if (!global._gadgetPageLoaded) {
                    global._gadgetPageLoaded = true;
                    renderDetail();
                    locale.processAllResources();
                }
            }
        })(this);
    </script>
</body>

</html>
